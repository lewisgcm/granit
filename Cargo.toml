[package]
name = "granit"
version = "0.1.0"
edition = "2021"
description = "A simple monorepo build tool that wraps Nix flakes"
license = "MIT"

[[bin]]
name = "granit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
glob = "0.3"
ignore = "0.4"

[dev-dependencies]
tempfile = "3.10"
